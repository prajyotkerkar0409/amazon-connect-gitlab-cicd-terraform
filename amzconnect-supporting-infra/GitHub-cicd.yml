name: Amazon Connect Supporting Infrastructure

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "amzconnect-supporting-infra/**"

  pull_request:
    paths:
      - "amzconnect-supporting-infra/**"

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment Environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stg
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_ROOT: amzconnect-supporting-infra/terraform

jobs:

  validate:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

  tflint:

    runs-on: ubuntu-latest
    needs: validate

    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}

    strategy:
      matrix:
        region:
          - us-east-1

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: terraform-linters/setup-tflint@v4

      - run: tflint

  checkov:

    runs-on: ubuntu-latest

    needs: validate

    steps:

      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: amzconnect-supporting-infra/terraform

  plan:

    runs-on: ubuntu-latest

    needs:
      - validate
      - tflint
      - checkov

    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}

    strategy:
      matrix:
        region:
          - us-east-1

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan

        run: |
          terraform plan \
          -var-file=env/${{ github.event.inputs.environment || 'dev' }}.tfvars \
          -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_ROOT }}/tfplan

  apply:

    runs-on: ubuntu-latest

    needs: plan

    environment: production

    if: github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_ROOT }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan    